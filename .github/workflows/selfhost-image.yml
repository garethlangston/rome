# Builds the Rome runtime image from this fork and pushes it to GHCR.
# Image: ghcr.io/<owner>/rome:latest, :<version> and :<short-sha>. linux/amd64 only.
# Run by hand (Actions > Self-host image > Run workflow) with a release tag or commit.
# Upstream main is sometimes broken; build a release tag whose upstream Docker build passed.
name: Self-host image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Tag, branch or commit to build (e.g. v1.1.171)"
        required: true
        default: v1.1.171
      version:
        description: "Optional image tag and ROME_VERSION override (e.g. 1.1.180-ses.1); skips the :latest tag"
        required: false
        default: ""

concurrency:
  group: selfhost-image
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
          ref: ${{ inputs.ref }}

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The self-host mail provider (packages/core/src/selfhost) needs these; adding them here
      # keeps package.json and pnpm-lock.yaml identical to upstream in git. The Docker build
      # installs with --frozen-lockfile from the lockfile this updates.
      - uses: pnpm/action-setup@v5

      - uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Add self-host mail dependencies
        run: |
          pnpm --filter @rome/core add --lockfile-only @aws-sdk/client-s3@^3.1163.0 @aws-sdk/client-sesv2@^3.1163.0 mailparser@^3.14.2 nodemailer@^10.3.1
          pnpm --filter @rome/core add --lockfile-only -D @types/mailparser @types/nodemailer

      - name: Prepare Docker runtime workspace
        run: node scripts/docker/prepare-runtime-workspace.mjs

      - name: Build metadata
        id: m
        run: |
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
          echo "time=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"
          ref="${{ inputs.ref }}"
          if [[ -n "${{ inputs.version }}" ]]; then v="${{ inputs.version }}"; elif [[ "$ref" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then v="${ref#v}"; else v="0.0.0-fork.$(git rev-parse --short HEAD)"; fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .docker/rome-runtime-workspace
          file: .docker/rome-runtime-workspace/Dockerfile
          platforms: linux/amd64
          push: true
          tags: |
            ${{ inputs.version == '' && format('ghcr.io/{0}/rome:latest', steps.m.outputs.owner) || '' }}
            ghcr.io/${{ steps.m.outputs.owner }}/rome:${{ steps.m.outputs.sha }}
            ghcr.io/${{ steps.m.outputs.owner }}/rome:${{ steps.m.outputs.version }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Rome self-host build from ${{ github.repository }}
          build-args: |
            ROME_DOCKER_APP_CODE_MODE=compiled
            ROME_VERSION=${{ steps.m.outputs.version }}
            ROME_BUILD_SHA=${{ steps.m.outputs.sha }}
            ROME_BUILD_TIME=${{ steps.m.outputs.time }}
          cache-from: type=gha,scope=selfhost-amd64
          cache-to: type=gha,mode=min,scope=selfhost-amd64
